product:
  type: kmp/lib
  platforms: [ jvm, android, iosArm64, iosSimulatorArm64, wasmJs ]

dependencies:
  - $compose.runtime
  - $compose.foundation
  - $libs.material.icons.core
  - $libs.material.icons.extended
  - $compose.material3
  - $compose.ui
  - $compose.components.resources
  - $compose.preview
  - $compose.hotReload.runtimeApi
  - $libs.androidx.lifecycle.viewmodel.compose
  - $libs.androidx.lifecycle.runtime.compose
  - $libs.androidx.navigation.compose
  - $libs.supabase.auth
  - $libs.supabase.functions

dependencies@android:
  - $compose.uiTooling
  - $libs.ktor.client.okhttp

dependencies@ios:
  - $libs.ktor.client.darwin

dependencies@jvm:
  - $libs.ktor.client.cio

dependencies@wasmJs:
  - $libs.ktor.client.js

settings:
  compose:
    enabled: true
    resources:
      packageName: io.aurafeed.quiz.resources
      # Generate public accessors so other modules (and previews) can use Res.*
      exposedAccessors: true
